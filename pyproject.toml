[project]
name = "halo-reporting"
version = "0.1.0"
description = "Halo Infinite stats auto-ingested from Halo Waypoint into git, reported on GitHub Pages."
requires-python = ">=3.12"
dependencies = [
    "spnkr>=0.10.2",
    "duckdb>=1.1",
    "pillow>=11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["halo"]
