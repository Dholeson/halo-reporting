name: Ingest & report

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:
    inputs:
      gamertags:
        description: "Look up / start tracking these gamertags (comma-separated). Pulls their full history."
        type: string
        default: ""
      backfill:
        description: "Keep paging past known matches to fill older history"
        type: boolean
        default: false
      max_new_matches:
        description: "Max new matches per player this run"
        type: string
        default: "1000"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.HALO_REFRESH_TOKEN != '' }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync

      - name: Backfill checkbox
        if: inputs.backfill
        run: echo "BACKFILL=1" >> "$GITHUB_ENV"

      - name: Add looked-up gamertags to players.txt
        if: inputs.gamertags != ''
        env:
          GAMERTAGS: ${{ inputs.gamertags }}
        run: |
          python3 - <<'PY'
          import os
          path = "players.txt"
          lines = open(path).read().splitlines()
          have = {l.strip().lower() for l in lines if l.strip() and not l.startswith("#")}
          new = [g.strip() for g in os.environ["GAMERTAGS"].split(",") if g.strip()]
          added = [g for g in new if g.lower() not in have]
          with open(path, "a") as f:
              f.writelines(g + "\n" for g in added)
          print("Added:", ", ".join(added) or "(already tracked)")
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write("ONLY_PLAYERS=" + ",".join(new) + "\nBACKFILL=1\n")
          PY

      - name: Pull new matches
        if: env.HAS_TOKEN == 'true'
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          HALO_REFRESH_TOKEN: ${{ secrets.HALO_REFRESH_TOKEN }}
          REFRESH_TOKEN_OUT: ${{ runner.temp }}/refresh_token
          MAX_NEW_MATCHES: ${{ inputs.max_new_matches || '100' }}
        run: uv run python -m halo.ingest

      # Microsoft rotates refresh tokens. Store the new one so the chain never goes stale.
      - name: Rotate refresh token
        if: always()
        env:
          GH_TOKEN: ${{ secrets.SECRETS_PAT }}
        run: |
          f="$RUNNER_TEMP/refresh_token"
          [ -s "$f" ] || exit 0
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::SECRETS_PAT not set; refresh token not rotated. It will expire eventually."
          else
            gh secret set HALO_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY" < "$f"
          fi
          rm -f "$f"

      - name: Commit new data
        run: |
          git config user.name "halo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data players.txt
          git diff --cached --quiet && exit 0
          git commit -m "data: ingest $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -q origin main
          git push

      - name: Build report
        run: uv run python -m halo.report

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
